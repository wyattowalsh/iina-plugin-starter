name: Release
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run build
      - name: Pack plugin
        run: zip -r plugin.iinaplgz Info.json dist/ pref.html -x "*.DS_Store"
      - uses: softprops/action-gh-release@v2
        with:
          files: plugin.iinaplgz
          generate_release_notes: true
