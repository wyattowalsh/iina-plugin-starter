<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
  </head>
  <body>
    <div class="pref-section">
      <label>
        <input type="checkbox" data-type="bool" data-pref-key="example_enabled" />
        Enable plugin features
      </label>
      <p class="small secondary pref-help">Toggle to enable the overlay HUD and OSD messages.</p>
    </div>
    <div class="pref-section">
      Custom overlay text:
      <div style="margin-top: 2px">
        <input type="text" data-pref-key="example_text" style="width: 100%" />
      </div>
      <p class="small secondary pref-help">Custom text displayed in the overlay widget.</p>
    </div>
  </body>
</html>
